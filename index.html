<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Maps Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#14161a;color:#e8eaed}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
button{background:#2d323c;color:#e8eaed;border:0;border-radius:6px;padding:6px 9px;font-size:12px}
button.pri{background:#0a84ff}
input,select{width:100%;background:#12141a;color:#fff;border:1px solid #3a4150;border-radius:5px;padding:5px;font-size:12px}
input[type=color]{padding:1px;height:28px}
label{display:block;font-size:10px;color:#9aa3b2;margin:5px 0 2px}
.mut{color:#9aa3b2;font-size:11px}
#top{display:flex;align-items:center;gap:3px;height:32px;padding:0 6px;background:#1b1d22;flex:none;overflow-x:auto}
#top button{flex:none}
#logo{font-size:11px;letter-spacing:1px;color:#0a84ff;font-weight:bold;margin-right:4px;flex:none}
.tab{background:transparent!important;border-radius:0;border-bottom:2px solid transparent;padding:7px 8px}
.tab.on{border-bottom-color:#0a84ff;color:#fff}
#ribbon{display:flex;gap:3px;padding:3px 6px;background:#23262d;flex:none;overflow-x:auto}
.rb{flex:none;min-width:44px;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;background:#2d323c;border-radius:6px;position:relative}
.rb i{font-style:normal;font-size:15px;line-height:1}
.rb.on{background:#0a84ff}
.rb input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0}
.sep{width:1px;background:#3a4150;flex:none;margin:2px}
body.fs #top,body.fs #ribbon{display:none}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
.fab{position:absolute;right:6px;width:34px;height:34px;background:#000a;font-size:15px;padding:0;z-index:4}
#fb1{top:6px}#fb2{top:46px}
#tip{position:absolute;left:8px;bottom:6px;font-size:10px;background:#000a;padding:2px 7px;border-radius:6px;pointer-events:none}
#log{position:absolute;left:8px;top:6px;display:flex;flex-direction:column;gap:2px;pointer-events:none;max-width:60%}
#log div{font-size:11px;background:#000b;padding:2px 7px;border-radius:6px}
#log .err{color:#ff6b6b}#log .ok{color:#5be08a}
#dock{width:210px;flex:none;background:#1e2127;display:none;flex-direction:column;border-left:1px solid #000}
#dock.on{display:flex}
.sh{background:#2a2e36;padding:5px 8px;font-size:11px;font-weight:bold;flex:none}
#tree{flex:1 1 40%;overflow:auto;padding:3px;min-height:60px}
#props{flex:1 1 60%;overflow:auto;padding:6px}
.tr{padding:6px 5px;font-size:12px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.s{background:#0a84ff66}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
@media(max-width:520px){#logo{display:none}#dock{width:170px}}
</style></head><body><div id="app">
<div id="top"><span id="logo">MAPS STUDIO</span>
<button class="tab on" data-t="home">HOME</button><button class="tab" data-t="model">MODEL</button><button class="tab" data-t="view">VIEW</button>
<span style="flex:1"></span>
<button id="bund">↶</button><button id="bred">↷</button><button id="bexp" class="pri">☁ Export</button></div>
<div id="ribbon"></div>
<div id="main">
<div id="stage"><canvas id="cv"></canvas><div id="log"></div><div id="tip"></div>
<button class="fab" id="fb1">☰</button><button class="fab" id="fb2">⛶</button></div>
<div id="dock"><div class="sh">Explorer</div><div id="tree"></div><div class="sh">Properties</div><div id="props"></div></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- three ---------- */
const cv=$('cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b6e8);
const cam=new THREE.PerspectiveCamera(60,1,.1,3000);
scene.add(new THREE.HemisphereLight(0xffffff,0x556677,.95));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(100,200,80);scene.add(sun);
const grid=new THREE.GridHelper(512,128,0x333333,0x5a5a5a);grid.position.y=.03;scene.add(grid);
function resize(){const s=$('stage');if(!s.clientWidth)return;R.setSize(s.clientWidth,s.clientHeight,false);cam.aspect=s.clientWidth/s.clientHeight;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('stage'));
const C={t:new THREE.Vector3(0,0,0),d:60,yaw:.8,pitch:.6};
function updCam(){C.pitch=Math.max(.05,Math.min(1.5,C.pitch));C.d=Math.max(3,Math.min(1500,C.d));
cam.position.set(C.t.x+C.d*Math.cos(C.pitch)*Math.sin(C.yaw),C.t.y+C.d*Math.sin(C.pitch),C.t.z+C.d*Math.cos(C.pitch)*Math.cos(C.yaw));cam.lookAt(C.t)}
const resetCam=()=>{C.t.set(0,0,0);C.d=60;C.yaw=.8;C.pitch=.6};

/* ---------- state ---------- */
let items=[],nid=1,sel=new Set(),tool='select',gsnap=1,multi=false,clip=[],hist=[],hi=-1,rtab='home';
const byId=id=>items.find(i=>i.id===id);
const selItems=()=>[...sel].map(byId).filter(Boolean);
const snapv=v=>gsnap>0?Math.round(v/gsnap)*gsnap:v;
function out(m,t){const d=document.createElement('div');d.className=t||'';d.textContent=m;const l=$('log');l.appendChild(d);while(l.children.length>3)l.removeChild(l.firstChild);setTimeout(()=>d.remove(),3500)}

function geo(s){return s==='Ball'?new THREE.SphereGeometry(.5,24,16):s==='Cylinder'?new THREE.CylinderGeometry(.5,.5,1,24).rotateZ(Math.PI/2):new THREE.BoxGeometry(1,1,1)}
function mk(it){const m=new THREE.Mesh(geo(it.shape),new THREE.MeshLambertMaterial({color:it.color}));m.userData.id=it.id;it.mesh=m;scene.add(m);sync(it)}
function sync(it){const m=it.mesh;m.position.set(it.pos[0],it.pos[1],it.pos[2]);m.scale.set(it.size[0],it.size[1],it.size[2]);m.rotation.y=it.ry*Math.PI/180;m.material.color.set(it.color)}
function add(shape,p){const it={id:nid++,name:shape==='Block'?'Part':shape,shape,pos:[0,2,0],size:[8,2,8],ry:0,color:'#a3a2a5',anch:true,can:true,lock:false,...p};items.push(it);mk(it);return it}
function insert(shape){const x=Math.round(C.t.x),z=Math.round(C.t.z),sz=shape==='Block'?[8,2,8]:[6,6,6];
const it=add(shape,{size:sz,pos:[x,sz[1]/2,z]});sel=new Set([it.id]);push();refresh();out('Menambah '+it.name+' ke Workspace','ok')}

/* ---------- history ---------- */
const snap=()=>JSON.stringify({items:items.map(({mesh,...r})=>r),nid});
function restore(s){const d=JSON.parse(s);items.forEach(i=>scene.remove(i.mesh));items=d.items;nid=d.nid;items.forEach(mk);sel=new Set([...sel].filter(id=>byId(id)));refresh()}
function push(){hist=hist.slice(0,hi+1);const s=snap();hist.push(s);if(hist.length>60)hist.shift();hi=hist.length-1;try{localStorage.setItem('mapstudio4',s)}catch(e){}}
$('bund').onclick=()=>{if(hi>0){hi--;restore(hist[hi])}};
$('bred').onclick=()=>{if(hi<hist.length-1){hi++;restore(hist[hi])}};

/* ---------- aksi ---------- */
function copy(){clip=[...sel];out('Disalin '+clip.length+' objek')}
function clone(it,off){const c={...it};delete c.mesh;c.id=nid++;c.pos=[...it.pos];c.size=[...it.size];c.pos[0]+=off;c.pos[2]+=off;items.push(c);mk(c);return c}
function paste(){const ids=clip.map(byId).filter(Boolean).map(i=>clone(i,4).id);if(!ids.length)return;sel=new Set(ids);push();refresh()}
function dup(){const ids=selItems().map(i=>clone(i,4).id);if(!ids.length)return;sel=new Set(ids);push();refresh()}
function del(){selItems().forEach(it=>{scene.remove(it.mesh);items.splice(items.indexOf(it),1)});sel=new Set();push();refresh()}
function flip(k){const ps=selItems();if(!ps.length)return;const v=!ps[0][k];ps.forEach(p=>p[k]=v);push();props();out(k+' = '+v)}
function nudge(d){selItems().forEach(p=>{p.pos[1]+=d*(gsnap||1);sync(p)});push();props()}
function focus(){const ps=selItems();if(!ps.length)return;const b=new THREE.Box3();ps.forEach(p=>b.expandByObject(p.mesh));C.t.copy(b.getCenter(new THREE.Vector3()));C.d=Math.max(12,b.getSize(new THREE.Vector3()).length()*1.6)}
function setTool(t){tool=t;giz._k=null;$('tip').textContent={select:'Select: ketuk objek. Geser ruang kosong = putar kamera.',move:'Move: sentuh part lalu geser. Panah = naik/turun.',scale:'Scale: seret kotak warna.',rotate:'Rotate: seret cincin hijau.'}[t];ribbon()}
function cycSnap(){const a=[0,.5,1,2,4,8];gsnap=a[(a.indexOf(gsnap)+1)%a.length];ribbon()}

/* ---------- explorer & properties ---------- */
const ICO={Block:'🧱',Ball:'⚪',Cylinder:'🛢'};
function tree(){$('tree').innerHTML='<div class="tr" style="color:#9aa3b2">🌍 Workspace '+items.length+'</div>'+items.map(i=>`<div class="tr${sel.has(i.id)?' s':''}" data-id="${i.id}" style="padding-left:16px">${ICO[i.shape]} ${esc(i.name)}</div>`).join('')}
$('tree').onclick=e=>{const r=e.target.closest('[data-id]');if(!r)return;const id=+r.dataset.id;
if(multi){sel.has(id)?sel.delete(id):sel.add(id)}else sel=new Set([id]);refresh()};
function props(){const s=selItems().slice(-1)[0],el=$('props');
if(!s){el.innerHTML='<p class="mut">Pilih objek di Explorer atau ketuk di layar.</p>';return}
const n3=(k,l)=>'<div class="g3">'+[0,1,2].map(i=>`<div><label>${l}${'XYZ'[i]}</label><input type="number" data-k="${k}" data-i="${i}" value="${+s[k][i].toFixed(2)}"></div>`).join('')+'</div>';
el.innerHTML=`<label>Nama</label><input data-k="name" value="${esc(s.name)}">`+n3('pos','Pos ')+n3('size','Size ')+
`<label>Rotasi Y</label><input type="number" data-k="ry" value="${+s.ry.toFixed(1)}"><label>Warna</label><input type="color" data-k="color" value="${s.color}">
<label><input type="checkbox" data-k="anch" ${s.anch?'checked':''} style="width:auto"> Anchored</label>
<label><input type="checkbox" data-k="can" ${s.can?'checked':''} style="width:auto"> CanCollide</label>`}
$('props').onchange=e=>{const t=e.target,k=t.dataset.k,s=selItems().slice(-1)[0];if(!s||!k)return;
const v=t.type==='checkbox'?t.checked:t.type==='number'?(parseFloat(t.value)||0):t.value;
if(k==='pos'||k==='size')s[k][+t.dataset.i]=k==='size'?Math.max(.1,v):v;else s[k]=v;
sync(s);push();tree()};
function refresh(){tree();props();ribbon()}

/* ---------- ribbon ---------- */
function ribbon(){const T={
home:[['🖱','Select',()=>setTool('select'),tool==='select'],['✥','Move',()=>setTool('move'),tool==='move'],['⤢','Scale',()=>setTool('scale'),tool==='scale'],['⟳','Rotate',()=>setTool('rotate'),tool==='rotate'],0,['▭','Block',()=>insert('Block')],['●','Sphere',()=>insert('Ball')],['⬭','Cylinder',()=>insert('Cylinder')],0,['⧉','Copy',copy],['📋','Paste',paste],['❐','Dup',dup],['🗑','Hapus',del]],
model:[['☑','Multi',()=>{multi=!multi;ribbon()},multi],['◎','Fokus',focus],0,['⚓','Anchor',()=>flip('anch')],['⛶','Collide',()=>flip('can')],['color'],0,['▲','Naik',()=>nudge(1)],['▼','Turun',()=>nudge(-1)]],
view:[['📂','Panel',()=>$('dock').classList.toggle('on')],['▦','Grid',()=>{grid.visible=!grid.visible}],['#','Snap '+(gsnap||'Off'),cycSnap],['⌂','Reset',resetCam]]}[rtab];
const r=$('ribbon');r.innerHTML='';
T.forEach(b=>{if(b===0){const s=document.createElement('span');s.className='sep';r.appendChild(s);return}
if(b[0]==='color'){const l=document.createElement('label');l.className='rb';l.style.margin=0;l.innerHTML='<i>🎨</i>Warna<input type="color" value="#a3a2a5">';
const inp=l.querySelector('input');inp.oninput=e=>{selItems().forEach(p=>{p.color=e.target.value;sync(p)})};inp.onchange=()=>{push();props()};r.appendChild(l);return}
const d=document.createElement('div');d.className='rb'+(b[3]?' on':'');d.innerHTML=`<i>${b[0]}</i>${b[1]}`;d.onclick=b[2];r.appendChild(d)})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{rtab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));ribbon()});
$('fb1').onclick=()=>{$('dock').classList.toggle('on');setTimeout(resize,30)};
$('fb2').onclick=()=>{document.body.classList.toggle('fs');setTimeout(resize,30)};

/* ---------- gizmo (panah / kotak / cincin) ---------- */
const giz=new THREE.Group();giz.visible=false;scene.add(giz);
const AX={x:new THREE.Vector3(1,0,0),y:new THREE.Vector3(0,1,0),z:new THREE.Vector3(0,0,1)};
const COL={x:0xff3b3b,y:0x35d04f,z:0x3b82ff};
const gm=c=>new THREE.MeshBasicMaterial({color:c,depthTest:false,transparent:true});
function buildGizmo(){while(giz.children.length)giz.remove(giz.children[0]);if(tool==='select')return;
['x','y','z'].forEach(a=>{if(tool==='rotate'&&a!=='y')return;const g=new THREE.Group();
if(tool==='rotate'){const ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,.08,8,48),gm(COL[a]));ring.rotation.x=Math.PI/2;g.add(ring)}
else{const sh=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.1,8),gm(COL[a]));sh.position.y=.65;g.add(sh);
const tip=tool==='move'?new THREE.Mesh(new THREE.ConeGeometry(.2,.5,12),gm(COL[a])):new THREE.Mesh(new THREE.BoxGeometry(.38,.38,.38),gm(COL[a]));
tip.position.y=tool==='move'?1.45:1.3;g.add(tip)}
if(a==='x')g.rotation.z=-Math.PI/2;if(a==='z')g.rotation.x=Math.PI/2;
g.traverse(o=>{o.renderOrder=999;o.userData.axis=a});giz.add(g)})}
function updGiz(){const ps=selItems();if(!ps.length||tool==='select'){giz.visible=false;return}
if(giz._k!==tool){giz._k=tool;buildGizmo()}
const c=new THREE.Vector3();ps.forEach(p=>c.add(p.mesh.position));c.divideScalar(ps.length);
giz.position.copy(c);giz.rotation.y=tool==='scale'?ps[0].ry*Math.PI/180:0;
giz.scale.setScalar(cam.position.distanceTo(c)*.13);giz.visible=true}

/* ---------- input ---------- */
const rc=new THREE.Raycaster(),P=new Map();let drag=null,moved=0,pv=null;
const boxes=[];
function updBoxes(){const ps=selItems().slice(0,40);
while(boxes.length<ps.length){const b=new THREE.BoxHelper(new THREE.Object3D(),0x00a2ff);scene.add(b);boxes.push(b)}
boxes.forEach((b,i)=>{if(i<ps.length){b.visible=true;b.setFromObject(ps[i].mesh)}else b.visible=false})}
function ndc(e){const r=cv.getBoundingClientRect();return new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1)}
function pick(e){rc.setFromCamera(ndc(e),cam);const h=rc.intersectObjects(items.filter(i=>!i.lock).map(i=>i.mesh))[0];return h?byId(h.object.userData.id):null}
function axisT(e,O,D){rc.setFromCamera(ndc(e),cam);const E=rc.ray.direction,w=O.clone().sub(rc.ray.origin),b=D.dot(E),d=D.dot(w),f=E.dot(w),den=1-b*b;return den<1e-4?0:(b*f-d)/den}
function gpt(e,y){rc.setFromCamera(ndc(e),cam);const t=new THREE.Vector3();return rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-y),t)?t:null}
function ang(e,O){const t=gpt(e,O.y);return t?Math.atan2(-(t.z-O.z),t.x-O.x):0}
function pair(){const a=[...P.values()];return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
if(P.size===1){drag=null;
if(giz.visible){rc.setFromCamera(ndc(e),cam);const h=rc.intersectObjects(giz.children,true)[0];
if(h){const a=h.object.userData.axis,O=giz.position.clone(),D=AX[a].clone().applyAxisAngle(AX.y,giz.rotation.y);
drag={m:'giz',a,O,D,t0:axisT(e,O,D),th0:ang(e,O),ps:selItems().map(i=>({i,pos:[...i.pos],size:[...i.size],ry:i.ry}))}}}
if(!drag&&(tool==='move'||tool==='select')){const h=pick(e);
if(h&&(tool==='move'||sel.has(h.id))){if(!sel.has(h.id)){sel=multi?new Set([...sel,h.id]):new Set([h.id]);refresh()}
const p0=gpt(e,h.pos[1]);if(p0)drag={m:'free',y:h.pos[1],p0,ps:selItems().filter(i=>!i.lock).map(i=>({i,pos:[...i.pos]}))}}}}
else if(P.size===2){drag=null;pv=pair()}});
cv.addEventListener('pointermove',e=>{const q=P.get(e.pointerId);if(!q)return;
const dx=e.clientX-q.x,dy=e.clientY-q.y;moved+=Math.abs(dx)+Math.abs(dy);q.x=e.clientX;q.y=e.clientY;
if(P.size===2&&pv){const n=pair();C.d*=pv.d/Math.max(n.d,1);
const k=C.d*.0015,mx=n.x-pv.x,my=n.y-pv.y;C.t.x-=Math.cos(C.yaw)*mx*k;C.t.z+=Math.sin(C.yaw)*mx*k;C.t.x+=-Math.sin(C.yaw)*my*k;C.t.z+=-Math.cos(C.yaw)*my*k;pv=n}
else if(P.size===1){
if(drag&&drag.m==='free'){const p=gpt(e,drag.y);if(p){const ox=snapv(p.x-drag.p0.x),oz=snapv(p.z-drag.p0.z);
drag.ps.forEach(o=>{o.i.pos=[o.pos[0]+ox,o.pos[1],o.pos[2]+oz];sync(o.i)})}}
else if(drag){const{a,O,D}=drag;
if(tool==='move'){const d=snapv(axisT(e,O,D)-drag.t0);drag.ps.forEach(o=>{o.i.pos=[o.pos[0]+D.x*d,o.pos[1]+D.y*d,o.pos[2]+D.z*d];sync(o.i)})}
else if(tool==='scale'){const d=snapv(axisT(e,O,D)-drag.t0),k='xyz'.indexOf(a);
drag.ps.forEach(o=>{const ns=Math.max(.1,o.size[k]+d),dd=ns-o.size[k];o.i.size=[...o.size];o.i.size[k]=ns;
const ax=AX[a].clone().applyAxisAngle(AX.y,o.ry*Math.PI/180);o.i.pos=[o.pos[0]+ax.x*dd/2,o.pos[1]+ax.y*dd/2,o.pos[2]+ax.z*dd/2];sync(o.i)})}
else{const dg=(ang(e,O)-drag.th0)*180/Math.PI;drag.ps.forEach(o=>{let r=o.ry+dg;if(gsnap>0)r=Math.round(r/15)*15;o.i.ry=r;sync(o.i)})}}
else{C.yaw-=dx*.008;C.pitch+=dy*.008}}});
function up(e){const was=P.size;P.delete(e.pointerId);
if(was===1){if(drag){if(moved>3)push();props();drag=null}
else if(moved<6){const h=pick(e);if(h){if(multi){sel.has(h.id)?sel.delete(h.id):sel.add(h.id)}else sel=new Set([h.id])}else if(!multi)sel=new Set();refresh()}}
pv=null}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();C.d*=1+e.deltaY*.001},{passive:false});
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
if(e.key==='Delete')del();else if(e.key==='f')focus();else if(e.ctrlKey&&e.key==='c')copy();else if(e.ctrlKey&&e.key==='v')paste();else if(e.ctrlKey&&e.key==='d'){e.preventDefault();dup()}});

/* ---------- export .rbxlx ---------- */
$('bexp').onclick=()=>{let r=0;
const part=it=>{const c=Math.cos(it.ry*Math.PI/180),s=Math.sin(it.ry*Math.PI/180),h=it.color,
col=((255<<24)|(parseInt(h.slice(1,3),16)<<16)|(parseInt(h.slice(3,5),16)<<8)|parseInt(h.slice(5,7),16))>>>0;
return`<Item class="Part" referent="RBX${++r}"><Properties><string name="Name">${esc(it.name)}</string><CoordinateFrame name="CFrame"><X>${it.pos[0]}</X><Y>${it.pos[1]}</Y><Z>${it.pos[2]}</Z><R00>${c}</R00><R01>0</R01><R02>${s}</R02><R10>0</R10><R11>1</R11><R12>0</R12><R20>${-s}</R20><R21>0</R21><R22>${c}</R22></CoordinateFrame><Vector3 name="size"><X>${it.size[0]}</X><Y>${it.size[1]}</Y><Z>${it.size[2]}</Z></Vector3><Color3uint8 name="Color3uint8">${col}</Color3uint8><token name="shape">${{Ball:0,Block:1,Cylinder:2}[it.shape]}</token><bool name="Anchored">${!!it.anch}</bool><bool name="CanCollide">${!!it.can}</bool></Properties></Item>`};
const x=`<roblox version="4"><Item class="Workspace" referent="RBX0"><Properties><string name="Name">Workspace</string></Properties>${items.map(part).join('')}</Item></roblox>`;
