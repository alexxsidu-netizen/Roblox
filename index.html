<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Maps Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#12161c;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#top{display:flex;gap:5px;padding:6px;overflow-x:auto;background:#1b212b;flex:none}
#top button{flex:none}
.sep{width:1px;background:#3a4354;flex:none}
button{background:#2a3240;color:#fff;border:0;border-radius:8px;padding:9px 11px;font-size:12px}
button.on,button.pri{background:#0a84ff}
#stage{flex:1;position:relative;min-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:6px;bottom:6px;right:6px;font-size:11px;background:#000a;padding:5px 8px;border-radius:8px;display:flex;justify-content:space-between;gap:8px}
#tabs{display:flex;background:#1b212b;flex:none}
#tabs button{flex:1;border-radius:0;background:#1b212b;border-bottom:2px solid transparent;padding:9px 4px}
#tabs button.on{border-bottom-color:#0a84ff;background:#242c39}
#sheet{height:34vh;overflow-y:auto;background:#242c39;padding:10px;flex:none}
.pn{display:none}.pn.on{display:block}
label{font-size:11px;color:#9ab;display:block;margin:6px 0 2px}
input,select,textarea{width:100%;background:#12161c;color:#fff;border:1px solid #3a4354;border-radius:6px;padding:8px;font-size:13px}
textarea{font-family:monospace;font-size:12px}
input[type=color]{padding:2px;height:36px}
input[type=checkbox]{width:auto}
input[type=range]{padding:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.r{display:flex;gap:6px}
.it{padding:8px;border-radius:6px;font-size:13px}
.it.ch{margin-left:14px}.it.s{background:#0a84ff55}
small,.mut{color:#9ab;font-size:11px}
#modal{display:none;position:fixed;inset:0;background:#000c;z-index:9;overflow-y:auto;padding:14px}
#modal.on{display:block}
#box{background:#1b212b;border-radius:14px;padding:14px;max-width:480px;margin:auto}
#log{white-space:pre-wrap;font-size:12px;background:#000;padding:8px;border-radius:8px;margin-top:8px;max-height:140px;overflow:auto}
#hud{position:absolute;top:6px;left:6px;right:6px;display:none;justify-content:space-between;align-items:center;font-size:14px;font-weight:bold;text-shadow:0 1px 3px #000}
#joy{position:absolute;left:14px;bottom:24px;width:110px;height:110px;border-radius:50%;background:#fff3;display:none;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffb;pointer-events:none}
#jb{position:absolute;right:18px;bottom:34px;width:76px;height:76px;border-radius:50%;background:#0a84ffcc;display:none;touch-action:none;font-size:13px}
body.play #top,body.play #tabs,body.play #sheet,body.play #hint{display:none}
body.play #hud{display:flex}body.play #joy,body.play #jb{display:block}
</style></head><body>

<div id="top">
<button data-tool="select" class="on">Select</button><button data-tool="move">Move</button><button data-tool="scale">Scale</button><button data-tool="rotate">Rotate</button>
<span class="sep"></span>
<button data-add="Part">+Part</button><button data-add="Ball">+Ball</button><button data-add="Cylinder">+Cyl</button>
<span class="sep"></span>
<button id="bdup">Dup</button><button id="bdel">Hapus</button><button id="bund">Undo</button><button id="bred">Redo</button>
<span class="sep"></span>
<button id="bplay" class="pri">▶ Play</button><button id="bpub" class="pri">Publish</button>
</div>

<div id="stage"><canvas id="cv"></canvas>
<div id="hud"><span id="hs"></span><button id="bstop" style="background:#e53935">■ Stop</button></div>
<div id="joy"><div id="knob"></div></div><button id="jb">Lompat</button>
<div id="hint"><span id="ht"></span><label style="margin:0;white-space:nowrap"><input type="checkbox" id="snap" checked> Snap</label></div></div>

<div id="tabs"><button data-t="list" class="on">Explorer</button><button data-t="props">Properties</button><button data-t="terr">Terrain</button><button data-t="tool">Toolbox</button><button data-t="game">Game</button></div>
<div id="sheet">
<div class="pn on" id="p-list"><div id="list"></div></div>
<div class="pn" id="p-props"><div id="props"></div></div>
<div class="pn" id="p-terr">
<div class="g3" id="bio"></div>
<label>Luas area (stud)</label><select id="tsz"><option>128</option><option selected>256</option><option>512</option></select>
<label>Tinggi dasar</label><input type="range" id="tbase" min="-30" max="30" value="0">
<label>Seed</label><div class="r"><input type="number" id="tseed" value="1"><button id="trnd">Seed acak</button></div>
<div class="r" style="margin-top:10px"><button id="tgen" class="pri" style="flex:1">Generate</button><button id="tdel">Hapus terrain</button></div>
</div>
<div class="pn" id="p-tool">
<label>ID Toolbox (boleh banyak, pisahkan koma/spasi)</label>
<input id="tid" placeholder="contoh: 123456789, 987654321">
<label>Nama (opsional, untuk ID tunggal)</label><input id="tname">
<button id="tadd" class="pri" style="width:100%;margin-top:10px">Tambah ke map</button>
<p class="mut" style="margin-top:8px">ID ada di URL Creator Store (angka di akhir link model). Model muncul sebagai kotak ungu di editor dan dimuat otomatis saat game jalan di Roblox (via InsertService). Model harus public atau milik kamu.</p>
</div>
<div class="pn" id="p-game">
<label>Tambah objek game</label>
<div class="g3"><button data-role="Spawn">Spawn</button><button data-role="Kill">Kill brick</button><button data-role="Check">Checkpoint</button><button data-role="Coin">Coin</button><button data-role="Jump">Jump pad</button></div>
<label>Waktu (ClockTime): <span id="cl">14</span></label><input type="range" id="clock" min="0" max="24" step="0.5" value="14">
<label>Script Lua custom (masuk ServerScriptService)</label>
<textarea id="lua" rows="6" placeholder="print('Halo dari Maps Studio')"></textarea>
</div>
</div>

<div id="modal"><div id="box">
<h3 style="margin-bottom:8px">Publish Map</h3>
<label>API Key (Open Cloud)</label><input type="password" id="ak" placeholder="Izin: universe-places:write">
<label>Universe ID</label><input id="un" inputmode="numeric">
<label>Place ID</label><input id="pl" inputmode="numeric">
<label>Tipe versi</label><select id="vt"><option value="Saved">Saved (disimpan, belum rilis)</option><option value="Published">Published (langsung rilis)</option></select>
<label>URL Worker proxy (wajib dari browser)</label><input id="pxy" placeholder="https://nama.workers.dev">
<div class="r" style="margin-top:10px"><button id="bexp" style="flex:1">Export .rbxlx</button><button id="bsend" class="pri" style="flex:1">Publish</button></div>
<button id="bclose" style="width:100%;margin-top:8px">Tutup</button>
<div id="log">Siap.</div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HS=60,HW=1,HH=2.5;

/* ---------- three ---------- */
const cv=$('cv'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b6e8);
const cam=new THREE.PerspectiveCamera(60,1,0.1,4000);
const hemi=new THREE.HemisphereLight(0xffffff,0x556677,0.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(100,200,80);scene.add(sun);
const grid=new THREE.GridHelper(512,64,0x333333,0x555555);grid.position.y=0.03;scene.add(grid);
const selBox=new THREE.BoxHelper(new THREE.Object3D(),0x00a2ff);selBox.visible=false;scene.add(selBox);
function resize(){const s=$('stage');renderer.setSize(s.clientWidth,s.clientHeight,false);cam.aspect=s.clientWidth/s.clientHeight;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('stage'));

/* ---------- kamera ---------- */
const C={t:new THREE.Vector3(0,0,0),d:140,yaw:.8,pitch:.6};
function updCam(){C.pitch=Math.max(.05,Math.min(1.5,C.pitch));C.d=Math.max(3,Math.min(2000,C.d));
cam.position.set(C.t.x+C.d*Math.cos(C.pitch)*Math.sin(C.yaw),C.t.y+C.d*Math.sin(C.pitch),C.t.z+C.d*Math.cos(C.pitch)*Math.cos(C.yaw));cam.lookAt(C.t)}

/* ---------- state ---------- */
let objs=[],terrain=null,terrMesh=null,sel=null,tool='select',nid=1,hist=[],hi=-1,sampler=null,clock=14,lua='';
const MATS={Plastic:256,Wood:512,Concrete:816,Brick:848,Grass:1280,Sand:1296,Neon:288,Glass:1568};
const ROLES={Spawn:{c:'#9e9e9e',s:[6,1,6],can:true,t:'Part'},Kill:{c:'#e53935',s:[8,1,8],can:true,t:'Part'},Check:{c:'#43a047',s:[8,1,8],can:true,t:'Part'},Coin:{c:'#fdd835',s:[2,2,2],can:false,t:'Ball'},Jump:{c:'#00e5ff',s:[6,1,6],can:true,t:'Part'}};

function mkMesh(o){
const g=o.type==='Ball'?new THREE.SphereGeometry(.5,24,16):o.type==='Cylinder'?new THREE.CylinderGeometry(.5,.5,1,24).rotateZ(Math.PI/2):new THREE.BoxGeometry(1,1,1);
const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:o.color}));
if(o.type==='Asset'){m.material.transparent=true;m.material.opacity=.55}
m.userData.o=o;o.mesh=m;scene.add(m);sync(o)}
function sync(o){const m=o.mesh;m.position.set(o.pos[0],o.pos[1],o.pos[2]);m.scale.set(o.size[0],o.size[1],o.size[2]);m.rotation.y=o.ry*Math.PI/180;m.material.color.set(o.color)}
function newObj(type,pos,size,color,name){const o={id:nid++,name:name||type,type,pos,size,ry:0,color:color||'#a3a2a5',mat:'Plastic',role:'None',can:true};objs.push(o);mkMesh(o);return o}
function applyClock(){const d=Math.max(0,Math.sin((clock-6)/12*Math.PI));scene.background.setRGB(.04+.49*d,.05+.66*d,.12+.79*d);hemi.intensity=.3+.6*d;sun.intensity=.1+.6*d;$('cl').textContent=clock}

/* ---------- terrain ---------- */
const BIOMES={Plains:{amp:.25,freq:2.5,water:.30,pal:'g'},Hills:{amp:.55,freq:3,water:.28,pal:'g'},Mountains:{amp:1,freq:3.5,water:.2,pal:'r'},Desert:{amp:.4,freq:2.5,water:0,pal:'s'},Arctic:{amp:.6,freq:3,water:.1,pal:'w'},Ocean:{amp:.35,freq:2.5,water:.65,pal:'g'}};
let tb='Mountains';
function makeNoise(seed){const p=new Uint8Array(512),perm=[...Array(256).keys()];let s=seed*9301+49297;
const rnd=()=>(s=(s*9301+49297)%233280)/233280;
for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
for(let i=0;i<512;i++)p[i]=perm[i&255];
const fade=t=>t*t*t*(t*(t*6-15)+10),lerp=(a,b,t)=>a+(b-a)*t,grad=(h,x,y)=>((h&1)?x:-x)+((h&2)?y:-y);
return(x,y)=>{const X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);
const u=fade(x),v=fade(y),a=p[X]+Y,b=p[X+1]+Y;
return lerp(lerp(grad(p[a],x,y),grad(p[b],x-1,y),u),lerp(grad(p[a+1],x,y-1),grad(p[b+1],x-1,y-1),u),v)}}
function makeSampler(t){const B=BIOMES[t.biome],n=makeNoise(t.seed),N=t.size;
return(x,z)=>{const u=x/N+.5,v=z/N+.5;let h=0,a=1,f=B.freq,tot=0;
for(let o=0;o<5;o++){h+=n(u*f,v*f)*a;tot+=a;a*=.5;f*=2}
h=(h/tot)*.5+.5;h=Math.pow(Math.max(0,h),1.2)*B.amp+(1-B.amp)*.35+t.base/100;h=Math.max(0,Math.min(1,h));
const wl=B.water;let y=h*HS,c;
if(h<wl){y=wl*HS;const d=h/wl;c=[.1+.1*d,.3+.25*d,.55+.25*d]}
else if(h<wl+.03)c=B.pal==='w'?[.86,.9,.94]:[.85,.78,.55];
else if(B.pal==='s')c=h>.7?[.67,.47,.27]:[.88,.76,.5];
else if(B.pal==='w')c=h>.55?[.96,.97,.99]:[.78,.84,.9];
else if(h>.78)c=[.94,.96,.97];
else if(h>.6&&B.pal==='r')c=[.4,.42,.47];
else if(h>.55)c=[.37,.49,.27];
else c=[.31+.16*(1-h),.55+.12*(1-h),.27];
return{y,c,water:h<wl}}}
function buildTerrain(){
if(terrMesh){scene.remove(terrMesh);terrMesh.geometry.dispose();terrMesh=null}
sampler=null;if(!terrain)return;
sampler=makeSampler(terrain);const N=terrain.size,R=128;
const g=new THREE.PlaneGeometry(N,N,R,R);g.rotateX(-Math.PI/2);
const pos=g.attributes.position,col=new Float32Array(pos.count*3);
for(let i=0;i<pos.count;i++){const s=sampler(pos.getX(i),pos.getZ(i));pos.setY(i,s.y);col.set(s.c,i*3)}
g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();
terrMesh=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));scene.add(terrMesh)}
const groundY=(x,z)=>sampler?sampler(x,z).y:0;

/* ---------- history ---------- */
function snap(){return JSON.stringify({objs:objs.map(o=>{const{mesh,...r}=o;return r}),terrain,nid,clock,lua})}
function restore(s){const d=JSON.parse(s),sid=sel&&sel.id;
objs.forEach(o=>scene.remove(o.mesh));objs=d.objs;terrain=d.terrain;nid=d.nid;clock=d.clock??14;lua=d.lua||'';
objs.forEach(o=>{if(o.role===undefined)o.role='None';if(o.can===undefined)o.can=true;mkMesh(o)});
buildTerrain();$('clock').value=clock;$('lua').value=lua;applyClock();
sel=objs.find(o=>o.id===sid)||null;renderList();renderProps()}
function push(){hist=hist.slice(0,hi+1);const s=snap();hist.push(s);if(hist.length>60)hist.shift();hi=hist.length-1;
try{localStorage.setItem('mapstudio2',s)}catch(e){}}
$('bund').onclick=()=>{if(hi>0){hi--;restore(hist[hi])}};
$('bred').onclick=()=>{if(hi<hist.length-1){hi++;restore(hist[hi])}};

/* ---------- UI ---------- */
const HINTS={select:'Ketuk objek untuk memilih. Geser = putar kamera, 2 jari = zoom/geser.',move:'Seret objek terpilih untuk memindah.',scale:'Seret objek terpilih naik/turun untuk ubah ukuran.',rotate:'Seret objek terpilih kiri/kanan untuk memutar.'};
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));$('ht').textContent=HINTS[t]}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
document.querySelectorAll('.pn').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t))});
function select(o){sel=o;renderList();renderProps()}
function renderList(){$('list').innerHTML='<div class="it"><b>Workspace</b></div>'+(terrain?`<div class="it ch">Terrain <small>${terrain.biome} ${terrain.size}</small></div>`:'')+
objs.map(o=>`<div class="it ch${o===sel?' s':''}" data-id="${o.id}">${esc(o.name)} <small>${o.type}${o.role&&o.role!=='None'?' · '+o.role:''}${o.type==='Asset'?' · '+(o.assetId||'?'):''}</small></div>`).join('')}
$('list').onclick=e=>{const d=e.target.closest('[data-id]');if(d)select(objs.find(o=>o.id==d.dataset.id))};
function renderProps(){const p=$('props');
if(!sel){p.innerHTML='<p class="mut">Pilih objek (ketuk di layar atau di Explorer).</p>';return}
const as=sel.type==='Asset';
const tri=(k,l)=>'<div class="g3">'+[0,1,2].map(i=>`<div><label>${l} ${'XYZ'[i]}</label><input type="number" step="1" data-k="${k}" data-i="${i}" value="${+sel[k][i].toFixed(2)}"></div>`).join('')+'</div>';
p.innerHTML=`<label>Nama</label><input data-k="name" value="${esc(sel.name)}">`
+(as?`<label>ID Toolbox</label><input type="number" data-k="assetId" value="${sel.assetId||''}">`:'')
+tri('pos','Pos')+(as?'':tri('size','Size'))
+`<label>Rotasi Y (derajat)</label><input type="number" data-k="ry" value="${+sel.ry.toFixed(1)}">`
+(as?'':`<label>Warna</label><input type="color" data-k="color" value="${sel.color}">
<label>Material</label><select data-k="mat">${Object.keys(MATS).map(m=>`<option${m===sel.mat?' selected':''}>${m}</option>`).join('')}</select>
<label>Role game</label><select data-k="role">${['None',...Object.keys(ROLES)].map(m=>`<option${m===sel.role?' selected':''}>${m}</option>`).join('')}</select>
<label><input type="checkbox" data-k="can" ${sel.can?'checked':''}> CanCollide</label>`)}
$('props').onchange=e=>{const t=e.target,k=t.dataset.k;if(!sel||!k)return;
if(k==='pos'||k==='size'){const v=parseFloat(t.value)||0;sel[k][+t.dataset.i]=k==='size'?Math.max(.1,v):v}
else if(k==='ry')sel.ry=parseFloat(t.value)||0;
else if(k==='can')sel.can=t.checked;
else if(k==='assetId'){sel.assetId=parseInt(t.value)||0}
else if(k==='role'){sel.role=t.value;const R=ROLES[t.value];if(R){sel.color=R.c;sel.can=R.can}renderProps()}
else sel[k]=t.value;
sync(sel);push();renderList()};

/* ---------- insert / dup / hapus ---------- */
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const ty=b.dataset.add,sz=ty==='Part'?[8,4,8]:ty==='Ball'?[6,6,6]:[8,6,6];
const x=Math.round(C.t.x),z=Math.round(C.t.z);select(newObj(ty,[x,groundY(x,z)+sz[1]/2,z],sz));push()});
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{const r=b.dataset.role,R=ROLES[r],x=Math.round(C.t.x),z=Math.round(C.t.z);
const o=newObj(R.t,[x,groundY(x,z)+R.s[1]/2+(r==='Coin'?2:0),z],[...R.s],R.c,r);o.role=r;o.can=R.can;sync(o);select(o);push()});
$('bdup').onclick=()=>{if(!sel)return;const o=newObj(sel.type,[sel.pos[0]+4,sel.pos[1],sel.pos[2]+4],[...sel.size],sel.color,sel.name+' copy');
o.ry=sel.ry;o.mat=sel.mat;o.role=sel.role;o.can=sel.can;if(sel.assetId)o.assetId=sel.assetId;sync(o);select(o);push()};
$('bdel').onclick=()=>{if(!sel)return;scene.remove(sel.mesh);objs=objs.filter(o=>o!==sel);sel=null;renderList();renderProps();push()};

/* ---------- toolbox ---------- */
$('tadd').onclick=()=>{const ids=$('tid').value.split(/[\s,;]+/).map(v=>parseInt(v)).filter(v=>v>0);
if(!ids.length)return;const x=Math.round(C.t.x),z=Math.round(C.t.z);let o;
ids.forEach((id,i)=>{o=newObj('Asset',[x+i*8,groundY(x+i*8,z)+3,z],[4,4,4],'#b84dff',(ids.length===1&&$('tname').value)||('Asset '+id));o.assetId=id});
select(o);push();$('tid').value='';$('tname').value=''};

/* ---------- game tab ---------- */
$('clock').oninput=()=>{clock=+$('clock').value;applyClock()};$('clock').onchange=push;
$('lua').onchange=()=>{lua=$('lua').value;push()};

/* ---------- terrain UI ---------- */
Object.keys(BIOMES).forEach(n=>{const b=document.createElement('button');b.textContent=n;if(n===tb)b.className='on';
b.onclick=()=>{tb=n;[...$('bio').children].forEach(x=>x.className='');b.className='on'};$('bio').appendChild(b)});
$('trnd').onclick=()=>{$('tseed').value=Math.floor(Math.random()*99999);$('tgen').click()};
$('tgen').onclick=()=>{terrain={biome:tb,size:+$('tsz').value,seed:+$('tseed').value||1,base:+$('tbase').value};buildTerrain();C.d=Math.max(C.d,terrain.size*.8);renderList();push()};
$('tdel').onclick=()=>{terrain=null;buildTerrain();renderList();push()};

/* ---------- input ---------- */
const rc=new THREE.Raycaster(),P=new Map();let drag=null,moved=0,pv=null;
function ndc(e){const r=cv.getBoundingClientRect();return new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1)}
function pick(e){rc.setFromCamera(ndc(e),cam);const h=rc.intersectObjects(objs.map(o=>o.mesh))[0];return h?h.object.userData.o:null}
function planePt(e,y){rc.setFromCamera(ndc(e),cam);const t=new THREE.Vector3();return rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-y),t)?t:null}
const snapv=v=>$('snap').checked?Math.round(v):v;
function pair(){const a=[...P.values()];return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
if(P.size===1){drag=null;if(!play&&sel&&tool!=='select'&&pick(e)===sel){const p=planePt(e,sel.pos[1]);
drag={x0:e.clientX,y0:e.clientY,off:p?[sel.pos[0]-p.x,sel.pos[2]-p.z]:[0,0],s0:[...sel.size],r0:sel.ry}}}
else if(P.size===2){drag=null;pv=pair()}});
cv.addEventListener('pointermove',e=>{const q=P.get(e.pointerId);if(!q)return;
const dx=e.clientX-q.x,dy=e.clientY-q.y;moved+=Math.abs(dx)+Math.abs(dy);q.x=e.clientX;q.y=e.clientY;
if(P.size===2&&pv){const n=pair();C.d*=pv.d/Math.max(n.d,1);
if(!play){const k=C.d*.0015,mx=n.x-pv.x,my=n.y-pv.y;
C.t.x-=Math.cos(C.yaw)*mx*k;C.t.z+=Math.sin(C.yaw)*mx*k;C.t.x+=-Math.sin(C.yaw)*my*k;C.t.z+=-Math.cos(C.yaw)*my*k}pv=n}
else if(P.size===1){
if(drag){if(tool==='move'){const p=planePt(e,sel.pos[1]);if(p){sel.pos[0]=snapv(p.x+drag.off[0]);sel.pos[2]=snapv(p.z+drag.off[1])}}
else if(tool==='scale'){const f=Math.max(.1,1-(e.clientY-drag.y0)*.005);sel.size=drag.s0.map(v=>Math.max(.1,+(v*f).toFixed(2)))}
else if(tool==='rotate'){sel.ry=snapv(drag.r0+(e.clientX-drag.x0)*.5)}sync(sel)}
else{C.yaw-=dx*.008;C.pitch+=dy*.008}}});
function up(e){const was=P.size;P.delete(e.pointerId);
if(was===1){if(drag){if(moved>3)push();renderProps();drag=null}else if(moved<6&&!play)select(pick(e))}
pv=null}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();C.d*=1+e.deltaY*.001},{passive:false});

/* ---------- PLAY MODE ---------- */
let play=null;const keys={},J={x:0,y:0,jump:false};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')J.jump=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')J.jump=false});
const joy=$('joy'),knob=$('knob');let jid=null;
function jmove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),R=r.width/2;
if(m>R){dx*=R/m;dy*=R/m}J.x=dx/R;J.y=-dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jmove(e)};
joy.onpointermove=e=>{if(e.pointerId===jid)jmove(e)};
joy.onpointerup=joy.onpointercancel=()=>{jid=null;J.x=J.y=0;knob.style.transform=''};
$('jb').onpointerdown=()=>{J.jump=true};$('jb').onpointerup=$('jb').onpointercancel=()=>{J.jump=false};
function bounds(o){const r=o.ry*Math.PI/180,c=Math.abs(Math.cos(r)),s=Math.abs(Math.sin(r)),hx=(c*o.size[0]+s*o.size[2])/2,hz=(s*o.size[0]+c*o.size[2])/2,hy=o.size[1]/2;
return{x0:o.pos[0]-hx,x1:o.pos[0]+hx,y0:o.pos[1]-hy,y1:o.pos[1]+hy,z0:o.pos[2]-hz,z1:o.pos[2]+hz}}
let savedD=140;
function startPlay(){if(play)return;select(null);selBox.visible=false;
const bx=objs.filter(o=>o.can&&o.type!=='Asset').map(bounds),rl=[];let n=0;
objs.forEach(o=>{if(o.role==='Check')rl.push({...bounds(o),o,k:'Check',ord:++n});else if(['Kill','Coin','Jump'].includes(o.role))rl.push({...bounds(o),o,k:o.role})});
const sp=objs.find(o=>o.role==='Spawn');
const spawn=sp?[sp.pos[0],sp.pos[1]+sp.size[1]/2+HH+.1,sp.pos[2]]:[0,groundY(0,0)+HH+.5,0];
const g=new THREE.Group(),M=c=>new THREE.MeshLambertMaterial({color:c});
const legs=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.5,.9),M(0x2e7d32));legs.position.y=-1.75;
const torso=new THREE.Mesh(new THREE.BoxGeometry(2,2,1),M(0x0a84ff));
const head=new THREE.Mesh(new THREE.SphereGeometry(.8,16,12),M(0xffd54f));head.position.y=1.7;
g.add(legs,torso,head);scene.add(g);
objs.forEach(o=>{if(o.type==='Asset')o.mesh.visible=false});
play={x:spawn[0],y:spawn[1],z:spawn[2],vy:0,gr:false,spawn,bx,rl,g,coins:0,stage:0,got:new Set()};
savedD=C.d;C.d=32;C.t.set(play.x,play.y,play.z);
document.body.classList.add('play');setTimeout(resize,60)}
function stopPlay(){if(!play)return;scene.remove(play.g);objs.forEach(o=>{o.mesh.visible=true});play=null;C.d=savedD;
document.body.classList.remove('play');J.x=J.y=0;setTimeout(resize,60)}
$('bplay').onclick=startPlay;$('bstop').onclick=stopPlay;
function respawn(){play.x=play.spawn[0];play.y=play.spawn[1];play.z=play.spawn[2];play.vy=0}
function stepPlay(dt){dt=Math.min(dt,.05);const pl=play;
let mx=J.x+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0),my=J.y+((keys.w||keys.arrowup)?1:0)-((keys.s||keys.arrowdown)?1:0);
const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
const fx=-Math.sin(C.yaw),fz=-Math.cos(C.yaw),rx=Math.cos(C.yaw),rz=-Math.sin(C.yaw);
const vx=(fx*my+rx*mx)*16,vz=(fz*my+rz*mx)*16;
if(J.jump&&pl.gr){pl.vy=53;pl.gr=false}
pl.vy-=196.2*dt;pl.gr=false;
const ov=b=>pl.x+HW>b.x0&&pl.x-HW<b.x1&&pl.y+HH>b.y0&&pl.y-HH<b.y1&&pl.z+HW>b.z0&&pl.z-HW<b.z1;
const step=b=>(b.y1-(pl.y-HH))<=1.5&&pl.vy<=.1;
pl.x+=vx*dt;for(const b of pl.bx)if(ov(b)){if(step(b))pl.y=b.y1+HH+.01;else pl.x=vx>0?b.x0-HW:b.x1+HW}
pl.z+=vz*dt;for(const b of pl.bx)if(ov(b)){if(step(b))pl.y=b.y1+HH+.01;else pl.z=vz>0?b.z0-HW:b.z1+HW}
pl.y+=pl.vy*dt;for(const b of pl.bx)if(ov(b)){if(pl.vy<=0){pl.y=b.y1+HH;pl.gr=true}else pl.y=b.y0-HH;pl.vy=0}
if(sampler){const gy=groundY(pl.x,pl.z);if(pl.y-HH<gy){pl.y=gy+HH;if(pl.vy<0)pl.vy=0;pl.gr=true}}
const E=.15,oe=b=>pl.x+HW+E>b.x0&&pl.x-HW-E<b.x1&&pl.y+HH+E>b.y0&&pl.y-HH-E<b.y1&&pl.z+HW+E>b.z0&&pl.z-HW-E<b.z1;
for(const r of pl.rl){if(!oe(r))continue;
if(r.k==='Kill')respawn();
else if(r.k==='Check'){if(r.ord>pl.stage){pl.stage=r.ord;pl.spawn=[r.o.pos[0],r.o.pos[1]+r.o.size[1]/2+HH+.2,r.o.pos[2]]}}
else if(r.k==='Coin'){if(!pl.got.has(r.o.id)){pl.got.add(r.o.id);pl.coins++;r.o.mesh.visible=false}}
else if(r.k==='Jump'){pl.vy=90;pl.gr=false}}
if(pl.y<-100)respawn();
pl.g.position.set(pl.x,pl.y,pl.z);if(Math.hypot(vx,vz)>.1)pl.g.rotation.y=Math.atan2(vx,vz);
C.t.lerp(new THREE.Vector3(pl.x,pl.y,pl.z),Math.min(1,dt*8));
$('hs').textContent='Coin: '+pl.coins+'   Stage: '+pl.stage}

let ref=0;
function partXML(n,pos,size,ry,hex,mat,shape,extra,cls){
const c=Math.cos(ry*Math.PI/180),s=Math.sin(ry*Math.PI/180),r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
const col=((255<<24)|(r<<16)|(g<<8)|b)>>>0;
return`<Item class="${cls||'Part'}" referent="RBX${++ref}"><Properties><string name="Name">${esc(n)}</string><CoordinateFrame name="CFrame"><X>${pos[0]}</X><Y>${pos[1]}</Y><Z>${pos[2]}</Z><R00>${c}</R00><R01>0</R01><R02>${s}</R02><R10>0</R10><R11>1</R11><R12>0</R12><R20>${-s}</R20><R21>0</R21><R22>${c}</R22></CoordinateFrame><Vector3 name="size"><X>${size[0]}</X><Y>${size[1]}</Y><Z>${size[2]}</Z></Vector3><Color3uint8 name="Color3uint8">${col}</Color3uint8><token name="Material">${mat}</token><token name="shape">${shape}</token><bool name="Anchored">true</bool>${extra||''}</Properties></Item>`}
function scriptXML(name,src){return`<Item class="Script" referent="RBX${++ref}"><Properties><string name="Name">${esc(name)}</string><ProtectedString name="Source"><![CDATA[${src.replace(/\]\]>/g,']] >')}]]></ProtectedString></Properties></Item>`}

const LUA_GAME=`local Players=game:GetService("Players")
local function onPlayer(p)
	local ls=Instance.new("Folder") ls.Name="leaderstats" ls.Parent=p
	local c=Instance.new("IntValue") c.Name="Coins" c.Parent=ls
	local s=Instance.new("IntValue") s.Name="Stage" s.Parent=ls
	p.CharacterAdded:Connect(function(ch)
		local cf=p:GetAttribute("SpawnCF")
		if cf then task.wait(0.1) ch:PivotTo(cf) end
	end)
end
Players.PlayerAdded:Connect(onPlayer)
for _,p in ipairs(Players:GetPlayers()) do onPlayer(p) end

local function who(hit)
	local ch=hit.Parent
	local h=ch and ch:FindFirstChildOfClass("Humanoid")
	if h then return Players:GetPlayerFromCharacter(ch),h end
end

local function hook(d)
	if not d:IsA("BasePart") then return end
	local n=d.Name
	if n:sub(1,5)=="Kill_" then
		d.Touched:Connect(function(hit)
			local _,h=who(hit)
			if h then h.Health=0 end
		end)
	elseif n:sub(1,6)=="Check_" then
		local order=tonumber(n:match("^Check_(%d+)")) or 1
		d.Touched:Connect(function(hit)
			local p=who(hit)
			if p then
				local cur=p:GetAttribute("StageNum") or 0
				if order>cur then
					p:SetAttribute("StageNum",order)
					p:SetAttribute("SpawnCF",d.CFrame+Vector3.new(0,4,0))
					p.leaderstats.Stage.Value=order
				end
			end
		end)
	elseif n:sub(1,5)=="Coin_" then
		local taken=false
		d.Touched:Connect(function(hit)
			if taken then return end
			local p=who(hit)
			if p then
				taken=true
				p.leaderstats.Coins.Value+=1
				d.Transparency=1
				task.wait(10)
				d.Transparency=0
				taken=false
			end
		end)
	elseif n:sub(1,5)=="Jump_" then
		d.Touched:Connect(function(hit)
			local _,h=who(hit)
			if h then
				local r=hit.Parent:FindFirstChild("HumanoidRootPart")
				if r then
					local v=r.AssemblyLinearVelocity
					r.AssemblyLinearVelocity=Vector3.new(v.X,90,v.Z)
				end
			end
		end)
	end
end
for _,d in ipairs(workspace:GetDescendants()) do hook(d) end
workspace.DescendantAdded:Connect(hook)`;

function buildXML(){ref=0;let body='',cnt=0;
const hex=c=>'#'+c.map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');
objs.forEach(o=>{if(o.type==='Asset')return;
let nm=o.name,cls='Part',ex=`<bool name="CanCollide">${o.can?'true':'false'}</bool>`;
if(o.role==='Kill')nm='Kill_'+nm;else if(o.role==='Check')nm='Check_'+(++cnt)+'_'+nm;else if(o.role==='Coin')nm='Coin_'+nm;else if(o.role==='Jump')nm='Jump_'+nm;
else if(o.role==='Spawn'){cls='SpawnLocation';ex+='<bool name="Neutral">true</bool>'}
body+=partXML(nm,o.pos,o.size,o.ry,o.color,MATS[o.mat]||256,{Ball:0,Part:1,Cylinder:2}[o.type],ex,cls)});
if(terrain){const G=40,cs=terrain.size/G;
for(let i=0;i<G;i++)for(let j=0;j<G;j++){const x=-terrain.size/2+cs*(i+.5),z=-terrain.size/2+cs*(j+.5),s=sampler(x,z),h=Math.max(1,s.y);
body+=partXML('Terrain_'+i+'_'+j,[+x.toFixed(2),+(h/2).toFixed(2),+z.toFixed(2)],[+cs.toFixed(2),+h.toFixed(2),+cs.toFixed(2)],0,hex(s.c),s.water?1568:1280,1)}}
if(!objs.some(o=>o.role==='Spawn'))body+=partXML('SpawnLocation',[0,+(groundY(0,0)+3).toFixed(2),0],[6,1,6],0,'#a3a2a5',256,1,'<bool name="Neutral">true</bool>','SpawnLocation');
let scripts='';
if(objs.some(o=>['Kill','Check','Coin','Jump'].includes(o.role)))scripts+=scriptXML('GameSystem',LUA_GAME);
const as=objs.filter(o=>o.type==='Asset'&&o.assetId);
if(as.length){const items=as.map(o=>`{id=${parseInt(o.assetId)},x=${o.pos[0]},y=${o.pos[1]},z=${o.pos[2]},ry=${o.ry}}`).join(',');
scripts+=scriptXML('ToolboxLoader',`local InsertService=game:GetService("InsertService")

		else
			warn("Gagal load asset "..it.id)
		end
	end)
end`)}

return`<roblox version="4"><Item class="Workspace" referent="RBX0"><Properties><string name="Name">Workspace</string></Properties>${body}</Item><Item class="Lighting" referent="RBXL"><Properties><string name="Name">Lighting</string><double name="ClockTime">${clock}</double></Properties></Item><Item class="ServerScriptService" referent="RBXS"><Properties><string name="Name">ServerScriptService</string></Properties>${scripts}</Item></roblox>`}

if(!key||!uni||!pl){log('Isi API key, Universe ID, dan Place ID.');return}
