<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Maps Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#14161a;color:#e8eaed;height:100dvh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
button{background:#2d323c;color:#e8eaed;border:0;border-radius:6px;padding:7px 9px;font-size:12px}
button.on,button.pri{background:#0a84ff}
button.red{background:#e53935}
input,select,textarea{width:100%;background:#12141a;color:#fff;border:1px solid #3a4150;border-radius:5px;padding:6px;font-size:12px}
input[type=checkbox]{width:auto}input[type=color]{padding:1px;height:30px}input[type=range]{padding:0}
label{font-size:10px;color:#9aa3b2;display:block;margin:5px 0 2px}
small,.mut{color:#9aa3b2;font-size:10px}
#menubar{height:36px;display:flex;align-items:center;gap:4px;padding:0 6px;background:#1b1d22;border-bottom:1px solid #000;flex:none;overflow-x:auto}
#menubar button{flex:none}
#logo{font-size:11px;letter-spacing:1px;color:#0a84ff;margin-right:4px;flex:none}
.rt{background:transparent!important;border-radius:0!important;border-bottom:2px solid transparent;padding:9px 7px!important}
.rt.on{border-bottom-color:#0a84ff;color:#fff}
#ribbon{display:flex;gap:3px;padding:4px 6px;background:#23262d;overflow-x:auto;flex:none;border-bottom:1px solid #000}
#ribbon.hide{display:none}
.rb{flex:none;min-width:48px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9px;background:#2d323c;border-radius:6px;padding:2px 4px;position:relative}
.rb i{font-style:normal;font-size:17px;line-height:1}
.rb.on{background:#0a84ff}
.rb input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}
.rsep{width:1px;background:#3a4150;flex:none;margin:2px}
#main{flex:1;display:flex;min-height:0}
.dock{display:flex;flex-direction:column;background:#1e2127;flex:none;overflow:hidden;min-width:100px}
.dock.hide,.rs.hide,.hide{display:none}
.rs{width:9px;flex:none;background:#101215;touch-action:none;position:relative}
.rs::after{content:"";position:absolute;left:3px;top:calc(50% - 14px);width:3px;height:28px;background:#667;border-radius:2px}
#stage{flex:1;position:relative;min-width:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
.edge{position:absolute;top:calc(50% - 26px);width:18px;height:52px;background:#000b;color:#fff;display:none;align-items:center;justify-content:center;font-size:13px;z-index:3}
.edge.show{display:flex}#el{left:0;border-radius:0 8px 8px 0}#er{right:0;border-radius:8px 0 0 8px}
#tip{position:absolute;left:24px;bottom:4px;font-size:10px;background:#000a;padding:2px 7px;border-radius:6px;pointer-events:none}
.sec{display:flex;flex-direction:column;flex:1 1 0;min-height:30px;border-top:1px solid #000}
.sh{display:flex;align-items:center;gap:4px;background:#2a2e36;padding:3px 6px;font-size:11px;font-weight:bold;flex:none}
.sh .chev{flex:none;padding:3px 0}.sh input{padding:3px 5px;font-size:11px}
.sb{flex:1;overflow:auto;padding:3px}
.sec.col .sb{display:none}.sec.col{flex:none}
.tr{display:flex;align-items:center;gap:4px;padding:5px 3px;font-size:12px;border-radius:4px;white-space:nowrap}
.tr.s{background:#0a84ff66}.tr .ar{width:16px;text-align:center;color:#9aa3b2}.tr .nm{overflow:hidden;text-overflow:ellipsis}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.r{display:flex;gap:4px}
.ltabs{display:flex;background:#2a2e36;flex:none}.ltabs button{flex:1;border-radius:0;background:transparent;padding:8px 2px}.ltabs button.on{background:#0a84ff}
.lbody{flex:1;overflow:auto;padding:6px}
#out{height:84px;background:#0c0d10;flex:none;display:flex;flex-direction:column;border-top:1px solid #000}
.oh{display:flex;gap:4px;align-items:center;padding:2px 6px;background:#2a2e36;font-size:11px}.oh b{flex:1}.oh button{padding:2px 8px}
#olog{flex:1;overflow:auto;font:11px monospace;padding:3px 6px}.err{color:#ff6b6b}.ok{color:#5be08a}
.ov{display:none;position:fixed;inset:0;background:#000c;z-index:20;padding:12px;overflow:auto}.ov.on{display:block}
.card{background:#1e2127;border-radius:12px;padding:12px;max-width:460px;margin:auto}
.ii{padding:10px;border-bottom:1px solid #2d323c;display:flex;justify-content:space-between;gap:8px;font-size:13px}
#ed{display:none;position:fixed;inset:0;background:#14161a;z-index:30;flex-direction:column}#ed.on{display:flex}
#edb{display:flex;gap:4px;padding:6px;background:#1b1d22;align-items:center;overflow-x:auto}#edb button,#edb select{flex:none;width:auto}
#edt{flex:1;border:0;border-radius:0;font:13px monospace;resize:none;tab-size:2;white-space:pre}
#plog{white-space:pre-wrap;font-size:12px;background:#000;padding:8px;border-radius:8px;margin-top:8px;max-height:140px;overflow:auto}
#hud{position:absolute;top:6px;left:6px;right:6px;display:none;justify-content:space-between;align-items:center;font-size:14px;font-weight:bold;text-shadow:0 1px 3px #000;z-index:4}
#joy{position:absolute;left:14px;bottom:24px;width:110px;height:110px;border-radius:50%;background:#fff3;display:none;touch-action:none;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffb;pointer-events:none}
#jb{position:absolute;right:18px;bottom:34px;width:76px;height:76px;border-radius:50%;background:#0a84ffcc;display:none;touch-action:none;z-index:4}
body.play #menubar,body.play #ribbon,body.play .dock,body.play .rs,body.play #out,body.play .edge,body.play #tip{display:none!important}
body.play #hud{display:flex}body.play #joy,body.play #jb{display:block}
@media(max-width:520px){#logo{display:none}}
</style></head><body><div id="app">

<div id="menubar"><b id="logo">MAPS STUDIO</b>
<button class="rt on" data-rt="home">HOME</button><button class="rt" data-rt="model">MODEL</button><button class="rt" data-rt="game">GAME</button><button class="rt" data-rt="view">VIEW</button>
<span style="flex:1"></span>
<button id="bund">↶</button><button id="bred">↷</button><button id="bplay" class="pri">▶ Play</button><button id="bpub" class="pri">☁ Publish</button></div>
<div id="ribbon"></div>

<div id="main">
<div class="dock hide" id="ldock" style="width:190px">
 <div class="ltabs"><button class="ltab on" data-l="tool">Toolbox</button><button class="ltab" data-l="terr">Terrain</button><button class="ltab" data-l="lit">Light</button></div>
 <div class="lbody">
  <div class="lp" id="lp-tool">
   <label>ID Toolbox (boleh banyak, pisah koma/spasi)</label><input id="tid" placeholder="123456789, 987654321">

  </div>
  <div class="lp hide" id="lp-terr">
   <div class="g3" id="bio"></div>
   <label>Luas area (stud)</label><select id="tsz"><option>128</option><option selected>256</option><option>512</option></select>
   <label>Tinggi dasar</label><input type="range" id="tbase" min="-30" max="30" value="0">
   <label>Seed</label><div class="r"><input type="number" id="tseed" value="1"><button id="trnd">Acak</button></div>
   <div class="r" style="margin-top:8px"><button id="tgen" class="pri" style="flex:1">Generate</button><button id="tdel">Hapus</button></div>
  </div>
  <div class="lp hide" id="lp-lit">
   <label>Waktu (ClockTime): <span id="cl">14</span></label><input type="range" id="clock" min="0" max="24" step="0.5" value="14">
  </div>
 </div>
</div>
<div class="rs hide" id="lrs"></div>

<div id="stage"><canvas id="cv"></canvas>
 <div class="edge show" id="el">▸</div><div class="edge show" id="er">◂</div>
 <div id="hud"><span id="hs"></span><button id="bstop" class="red">■ Stop</button></div>
 <div id="joy"><div id="knob"></div></div><button id="jb">Lompat</button>
 <div id="tip"></div>
</div>

<div class="rs hide" id="rrs"></div>
<div class="dock hide" id="rdock" style="width:170px">
 <div class="sec" id="sx"><div class="sh"><span class="chev" data-c="sx">▾ Explorer</span><input id="qf" placeholder="cari..."></div><div class="sb" id="tree"></div></div>
 <div class="sec" id="sp"><div class="sh"><span class="chev" data-c="sp">▾ Properties</span></div><div class="sb" id="props"></div></div>
</div>
</div>

<div id="out" class="hide"><div class="oh"><b>Output</b><button id="oclr">Bersihkan</button><button id="ocls">✕</button></div><div id="olog"></div></div>
</div>

<div class="ov" id="ins"><div class="card"><input id="iq" placeholder="Cari objek..."><div id="il" style="margin-top:6px"></div><button id="icl" style="width:100%;margin-top:8px">Tutup</button></div></div>

<div id="ed"><div id="edb"><b id="edn" style="flex:1;font-size:12px"></b>
<select id="edtp"><option value="">Template...</option><option value="hello">Hello</option><option value="touch">Touched</option><option value="ls">Leaderstats</option><option value="loop">Loop</option><option value="remote">RemoteEvent</option></select>
<button id="edm">A-</button><button id="edp">A+</button><button id="edtab">Tab</button><button id="edx" class="pri">Simpan</button></div>
<textarea id="edt" spellcheck="false"></textarea></div>

<div class="ov" id="modal"><div class="card">
<h3 style="margin-bottom:6px">Publish Map</h3>
<label>API Key (Open Cloud)</label><input type="password" id="ak" placeholder="Izin: universe-places:write">
<label>Universe ID</label><input id="un" inputmode="numeric">
<label>Place ID</label><input id="pl" inputmode="numeric">
<label>Tipe versi</label><select id="vt"><option value="Saved">Saved (belum rilis)</option><option value="Published">Published (langsung rilis)</option></select>
<label>URL Worker proxy (wajib dari browser)</label><input id="pxy" placeholder="https://nama.workers.dev">
<div class="r" style="margin-top:10px"><button id="bexp" style="flex:1">Export .rbxlx</button><button id="bsend" class="pri" style="flex:1">Publish</button></div>
<button id="bclose" style="width:100%;margin-top:8px">Tutup</button><div id="plog">Siap.</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HS=60,HW=1,HH=2.5;
const SVC=['Workspace','ReplicatedStorage','ServerScriptService','ServerStorage','StarterGui','StarterPack','StarterPlayerScripts'];
const SICO={Workspace:'🌍',ReplicatedStorage:'📡',ServerScriptService:'📜',ServerStorage:'🗄',StarterGui:'🖥',StarterPack:'🎒',StarterPlayerScripts:'🏃'};
const ICO={Part:'🧱',Model:'📦',Folder:'📁',Asset:'🧰',Script:'📜',LocalScript:'📱',ModuleScript:'🧩',Sound:'🔊',PointLight:'💡',ScreenGui:'🖼',TextLabel:'🔤'};
const MATS={Plastic:256,Wood:512,Concrete:816,Brick:848,Grass:1280,Sand:1296,Neon:288,Glass:1568};
const ROLES={Spawn:{c:'#9e9e9e',s:[6,1,6],can:true,t:'Block'},Kill:{c:'#e53935',s:[8,1,8],can:true,t:'Block'},Check:{c:'#43a047',s:[8,1,8],can:true,t:'Block'},Coin:{c:'#fdd835',s:[2,2,2],can:false,t:'Ball'},Jump:{c:'#00e5ff',s:[6,1,6],can:true,t:'Block'}};
const CAT=[['Part','Block (Part)','Part 3D dasar'],['Ball','Sphere','Part bulat'],['Cylinder','Cylinder','Part silinder'],['Model','Model','Wadah objek'],['Folder','Folder','Pengelompok'],['Script','Script','Script server'],['LocalScript','LocalScript','Script client'],['ModuleScript','ModuleScript','Modul bersama'],['Sound','Sound','Audio (ID)'],['PointLight','PointLight','Lampu (di dalam Part)'],['ScreenGui','ScreenGui','Wadah UI'],['TextLabel','TextLabel','Teks UI (di dalam ScreenGui)'],['Spawn','SpawnLocation','Titik spawn'],['Kill','Kill Brick','Mati saat disentuh'],['Check','Checkpoint','Simpan progres'],['Coin','Coin','Koin kumpulan'],['Jump','Jump Pad','Pegas lompat']];

/* ---------- three ---------- */
const cv=$('cv'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b6e8);
const cam=new THREE.PerspectiveCamera(60,1,0.1,4000);
const hemi=new THREE.HemisphereLight(0xffffff,0x556677,0.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(100,200,80);scene.add(sun);
const gridM=new THREE.GridHelper(512,64,0x333333,0x555555);gridM.position.y=0.03;scene.add(gridM);
function resize(){const s=$('stage');if(!s.clientWidth)return;renderer.setSize(s.clientWidth,s.clientHeight,false);cam.aspect=s.clientWidth/s.clientHeight;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('stage'));
const C={t:new THREE.Vector3(0,0,0),d:140,yaw:.8,pitch:.6};
function updCam(){C.pitch=Math.max(.05,Math.min(1.5,C.pitch));C.d=Math.max(3,Math.min(2000,C.d));
cam.position.set(C.t.x+C.d*Math.cos(C.pitch)*Math.sin(C.yaw),C.t.y+C.d*Math.sin(C.pitch),C.t.z+C.d*Math.cos(C.pitch)*Math.cos(C.yaw));cam.lookAt(C.t)}
const resetCam=()=>{C.t.set(0,0,0);C.d=140;C.yaw=.8;C.pitch=.6};

/* ---------- state ---------- */
let items=[],nid=1,terrain=null,terrMesh=null,sampler=null,clock=14,hist=[],hi=-1;
let selIds=new Set(),curSvc=null,tool='select',multi=false,gsnap=1,clip=[],play=null,rtab='home',lastTap={k:null,t:0};
const exp=new Set(['Workspace']);
const byId=id=>items.find(i=>i.id===id);
const kids=p=>items.filter(i=>i.par===p);
const is3D=i=>i.cls==='Part'||i.cls==='Asset';
function rootSvc(it){let c=it;while(typeof c.par==='number'){c=byId(c.par);if(!c)return null}return c.par}
const isWS=it=>rootSvc(it)==='Workspace';
function desc(it,o=[]){kids(it.id).forEach(k=>{o.push(k);desc(k,o)});return o}
function S1(){const a=[...selIds];return a.length?byId(a[a.length-1]):null}
function selParts(){const s=new Set();selIds.forEach(id=>{const it=byId(id);if(!it)return;if(is3D(it))s.add(it);desc(it).forEach(d=>is3D(d)&&s.add(d))});return[...s].filter(isWS)}
const snapv=v=>gsnap>0?Math.round(v/gsnap)*gsnap:v;
function out(m,t){const d=document.createElement('div');d.className=t||'';d.textContent=m;$('olog').appendChild(d);$('olog').scrollTop=1e9}

const DEF={
Part:()=>({shape:'Block',pos:[0,2,0],size:[8,2,8],ry:0,color:'#a3a2a5',mat:'Plastic',role:'None',anch:true,can:true,lock:false}),
Asset:()=>({shape:'Block',pos:[0,3,0],size:[4,4,4],ry:0,color:'#b84dff',assetId:0}),
Script:()=>({src:'print("Halo dari Maps Studio")'}),LocalScript:()=>({src:'print("Halo client")'}),
ModuleScript:()=>({src:'local M={}\n\nreturn M'}),
Sound:()=>({soundId:0,loop:true,vol:.5}),PointLight:()=>({bright:1,range:16,lcolor:'#ffffff'}),
TextLabel:()=>({text:'Halo',textSize:24,gx:10,gy:10,gw:200,gh:40,bg:'#000000',fg:'#ffffff'}),
Model:()=>({}),Folder:()=>({}),ScreenGui:()=>({})};
function add(cls,props,par){const it={id:nid++,name:cls,cls,par,...DEF[cls](),...props};items.push(it);if(is3D(it))mkMesh(it);return it}

function geom(it){return it.shape==='Ball'?new THREE.SphereGeometry(.5,24,16):it.shape==='Cylinder'?new THREE.CylinderGeometry(.5,.5,1,24).rotateZ(Math.PI/2):new THREE.BoxGeometry(1,1,1)}
function mkMesh(it){const m=new THREE.Mesh(geom(it),new THREE.MeshLambertMaterial({color:it.color}));
if(it.cls==='Asset'){m.material.transparent=true;m.material.opacity=.55}
m.userData.id=it.id;it.mesh=m;scene.add(m);sync(it)}
function sync(it){const m=it.mesh;if(!m)return;m.position.set(it.pos[0],it.pos[1],it.pos[2]);m.scale.set(it.size[0],it.size[1],it.size[2]);
m.rotation.y=it.ry*Math.PI/180;m.material.color.set(it.color);m.visible=isWS(it)&&!(play&&it.cls==='Asset')}
const syncAll=()=>items.forEach(sync);
function applyClock(){const d=Math.max(0,Math.sin((clock-6)/12*Math.PI));scene.background.setRGB(.04+.49*d,.05+.66*d,.12+.79*d);hemi.intensity=.3+.6*d;sun.intensity=.1+.6*d;$('cl').textContent=clock}

/* ---------- terrain ---------- */
const BIOMES={Plains:{amp:.25,freq:2.5,water:.30,pal:'g'},Hills:{amp:.55,freq:3,water:.28,pal:'g'},Mountains:{amp:1,freq:3.5,water:.2,pal:'r'},Desert:{amp:.4,freq:2.5,water:0,pal:'s'},Arctic:{amp:.6,freq:3,water:.1,pal:'w'},Ocean:{amp:.35,freq:2.5,water:.65,pal:'g'}};
let tb='Mountains';
function makeNoise(seed){const p=new Uint8Array(512),perm=[...Array(256).keys()];let s=seed*9301+49297;
const rnd=()=>(s=(s*9301+49297)%233280)/233280;
for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
for(let i=0;i<512;i++)p[i]=perm[i&255];
const fade=t=>t*t*t*(t*(t*6-15)+10),lerp=(a,b,t)=>a+(b-a)*t,grad=(h,x,y)=>((h&1)?x:-x)+((h&2)?y:-y);
return(x,y)=>{const X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);
const u=fade(x),v=fade(y),a=p[X]+Y,b=p[X+1]+Y;
return lerp(lerp(grad(p[a],x,y),grad(p[b],x-1,y),u),lerp(grad(p[a+1],x,y-1),grad(p[b+1],x-1,y-1),u),v)}}
function makeSampler(t){const B=BIOMES[t.biome],n=makeNoise(t.seed),N=t.size;
return(x,z)=>{const u=x/N+.5,v=z/N+.5;let h=0,a=1,f=B.freq,tot=0;
for(let o=0;o<5;o++){h+=n(u*f,v*f)*a;tot+=a;a*=.5;f*=2}
h=(h/tot)*.5+.5;h=Math.pow(Math.max(0,h),1.2)*B.amp+(1-B.amp)*.35+t.base/100;h=Math.max(0,Math.min(1,h));
const wl=B.water;let y=h*HS,c;
if(h<wl){y=wl*HS;const d=h/wl;c=[.1+.1*d,.3+.25*d,.55+.25*d]}
else if(h<wl+.03)c=B.pal==='w'?[.86,.9,.94]:[.85,.78,.55];
else if(B.pal==='s')c=h>.7?[.67,.47,.27]:[.88,.76,.5];
else if(B.pal==='w')c=h>.55?[.96,.97,.99]:[.78,.84,.9];
else if(h>.78)c=[.94,.96,.97];
else if(h>.6&&B.pal==='r')c=[.4,.42,.47];
else if(h>.55)c=[.37,.49,.27];
else c=[.31+.16*(1-h),.55+.12*(1-h),.27];
return{y,c,water:h<wl}}}
function buildTerrain(){
if(terrMesh){scene.remove(terrMesh);terrMesh.geometry.dispose();terrMesh=null}
sampler=null;if(!terrain)return;
sampler=makeSampler(terrain);const N=terrain.size,R=128;
const g=new THREE.PlaneGeometry(N,N,R,R);g.rotateX(-Math.PI/2);
const pos=g.attributes.position,col=new Float32Array(pos.count*3);
for(let i=0;i<pos.count;i++){const s=sampler(pos.getX(i),pos.getZ(i));pos.setY(i,s.y);col.set(s.c,i*3)}
g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();
terrMesh=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));scene.add(terrMesh)}
const groundY=(x,z)=>sampler?sampler(x,z).y:0;
Object.keys(BIOMES).forEach(n=>{const b=document.createElement('button');b.textContent=n;if(n===tb)b.className='on';
b.onclick=()=>{tb=n;[...$('bio').children].forEach(x=>x.className='');b.className='on'};$('bio').appendChild(b)});
$('trnd').onclick=()=>{$('tseed').value=Math.floor(Math.random()*99999);$('tgen').click()};
$('tgen').onclick=()=>{terrain={biome:tb,size:+$('tsz').value,seed:+$('tseed').value||1,base:+$('tbase').value};buildTerrain();C.d=Math.max(C.d,terrain.size*.8);exp.add('Workspace');refresh();push();out('Terrain '+tb+' dibuat','ok')};
$('tdel').onclick=()=>{terrain=null;buildTerrain();refresh();push()};

/* ---------- history ---------- */
function snap(){return JSON.stringify({items:items.map(i=>{const{mesh,...r}=i;return r}),terrain,nid,clock})}
function restore(s){const d=JSON.parse(s);items.forEach(i=>i.mesh&&scene.remove(i.mesh));
items=d.items;terrain=d.terrain;nid=d.nid;clock=d.clock??14;items.forEach(i=>{if(is3D(i))mkMesh(i)});

const joy=$('joy'),knob=$('knob');let jid=null;
function jmove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),R=r.width/2;
if(m>R){dx*=R/m;dy*=R/m}J.x=dx/R;J.y=-dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jmove(e)};
joy.onpointermove=e=>{if(e.pointerId===jid)jmove(e)};
joy.onpointerup=joy.onpointercancel=()=>{jid=null;J.x=J.y=0;knob.style.transform=''};
$('jb').onpointerdown=()=>{J.jump=true};$('jb').onpointerup=$('jb').onpointercancel=()=>{J.jump=false};
function bounds(o){const r=o.ry*Math.PI/180,c=Math.abs(Math.cos(r)),s=Math.abs(Math.sin(r)),hx=(c*o.size[0]+s*o.size[2])/2,hz=(s*o.size[0]+c*o.size[2])/2,hy=o.size[1]/2;
return{x0:o.pos[0]-hx,x1:o.pos[0]+hx,y0:o.pos[1]-hy,y1:o.pos[1]+hy,z0:o.pos[2]-hz,z1:o.pos[2]+hz}}
let savedD=140;
function startPlay(){if(play)return;selIds=new Set();curSvc=null;refresh();
const ps=items.filter(i=>i.cls==='Part'&&isWS(i)),bx=ps.filter(i=>i.can).map(bounds),rl=[];let n=0;
ps.forEach(o=>{if(o.role==='Check')rl.push({...bounds(o),o,k:'Check',ord:++n});else if(['Kill','Coin','Jump'].includes(o.role))rl.push({...bounds(o),o,k:o.role})});
const sp=ps.find(o=>o.role==='Spawn');
const spawn=sp?[sp.pos[0],sp.pos[1]+sp.size[1]/2+HH+.1,sp.pos[2]]:[0,groundY(0,0)+HH+.5,0];
const g=new THREE.Group(),M=c=>new THREE.MeshLambertMaterial({color:c});
const legs=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.5,.9),M(0x2e7d32));legs.position.y=-1.75;
const torso=new THREE.Mesh(new THREE.BoxGeometry(2,2,1),M(0x0a84ff));
const head=new THREE.Mesh(new THREE.SphereGeometry(.8,16,12),M(0xffd54f));head.position.y=1.7;
g.add(legs,torso,head);scene.add(g);
play={x:spawn[0],y:spawn[1],z:spawn[2],vy:0,gr:false,spawn,bx,rl,g,coins:0,stage:0,got:new Set()};
syncAll();savedD=C.d;C.d=32;C.t.set(play.x,play.y,play.z);
document.body.classList.add('play');setTimeout(resize,60);out('Play dimulai (script Lua tidak dijalankan di browser)')}
function stopPlay(){if(!play)return;scene.remove(play.g);play=null;syncAll();C.d=savedD;document.body.classList.remove('play');J.x=J.y=0;setTimeout(resize,60)}
$('bplay').onclick=startPlay;$('bstop').onclick=stopPlay;
function respawn(){play.x=play.spawn[0];play.y=play.spawn[1];play.z=play.spawn[2];play.vy=0}
function stepPlay(dt){dt=Math.min(dt,.05);const pl=play;
let mx=J.x+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0),my=J.y+((keys.w||keys.arrowup)?1:0)-((keys.s||keys.arrowdown)?1:0);
const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
const fx=-Math.sin(C.yaw),fz=-Math.cos(C.yaw),rx=Math.cos(C.yaw),rz=-Math.sin(C.yaw);
const vx=(fx*my+rx*mx)*16,vz=(fz*my+rz*mx)*16;
if(J.jump&&pl.gr){pl.vy=53;pl.gr=false}
pl.vy-=196.2*dt;pl.gr=false;
const ov=b=>pl.x+HW>b.x0&&pl.x-HW<b.x1&&pl.y+HH>b.y0&&pl.y-HH<b.y1&&pl.z+HW>b.z0&&pl.z-HW<b.z1;
const step=b=>(b.y1-(pl.y-HH))<=1.5&&pl.vy<=.1;
pl.x+=vx*dt;for(const b of pl.bx)if(ov(b)){if(step(b))pl.y=b.y1+HH+.01;else pl.x=vx>0?b.x0-HW:b.x1+HW}
pl.z+=vz*dt;for(const b of pl.bx)if(ov(b)){if(step(b))pl.y=b.y1+HH+.01;else pl.z=vz>0?b.z0-HW:b.z1+HW}
pl.y+=pl.vy*dt;for(const b of pl.bx)if(ov(b)){if(pl.vy<=0){pl.y=b.y1+HH;pl.gr=true}else pl.y=b.y0-HH;pl.vy=0}
if(sampler){const gy=groundY(pl.x,pl.z);if(pl.y-HH<gy){pl.y=gy+HH;if(pl.vy<0)pl.vy=0;pl.gr=true}}
const E=.15,oe=b=>pl.x+HW+E>b.x0&&pl.x-HW-E<b.x1&&pl.y+HH+E>b.y0&&pl.y-HH-E<b.y1&&pl.z+HW+E>b.z0&&pl.z-HW-E<b.z1;
for(const r of pl.rl){if(!oe(r))continue;
if(r.k==='Kill')respawn();
else if(r.k==='Check'){if(r.ord>pl.stage){pl.stage=r.ord;pl.spawn=[r.o.pos[0],r.o.pos[1]+r.o.size[1]/2+HH+.2,r.o.pos[2]]}}
else if(r.k==='Coin'){if(!pl.got.has(r.o.id)){pl.got.add(r.o.id);pl.coins++;r.o.mesh.visible=false}}
else if(r.k==='Jump'){pl.vy=90;pl.gr=false}}
if(pl.y<-100)respawn();
pl.g.position.set(pl.x,pl.y,pl.z);if(Math.hypot(vx,vz)>.1)pl.g.rotation.y=Math.atan2(vx,vz);
C.t.lerp(new THREE.Vector3(pl.x,pl.y,pl.z),Math.min(1,dt*8));
$('hs').textContent='Coin: '+pl.coins+'   Stage: '+pl.stage}

/* ---------- export / publish ---------- */
let ref=0;
const c3=(n,hex)=>`<Color3 name="${n}"><R>${parseInt(hex.slice(1,3),16)/255}</R><G>${parseInt(hex.slice(3,5),16)/255}</G><B>${parseInt(hex.slice(5,7),16)/255}</B></Color3>`;
function partXML(n,pos,size,ry,hex,mat,shape,extra,cls,inner,anch){
const c=Math.cos(ry*Math.PI/180),s=Math.sin(ry*Math.PI/180),r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
const col=((255<<24)|(r<<16)|(g<<8)|b)>>>0;
return`<Item class="${cls||'Part'}" referent="RBX${++ref}"><Properties><string name="Name">${esc(n)}</string><CoordinateFrame name="CFrame"><X>${pos[0]}</X><Y>${pos[1]}</Y><Z>${pos[2]}</Z><R00>${c}</R00><R01>0</R01><R02>${s}</R02><R10>0</R10><R11>1</R11><R12>0</R12><R20>${-s}</R20><R21>0</R21><R22>${c}</R22></CoordinateFrame><Vector3 name="size"><X>${size[0]}</X><Y>${size[1]}</Y><Z>${size[2]}</Z></Vector3><Color3uint8 name="Color3uint8">${col}</Color3uint8><token name="Material">${mat}</token><token name="shape">${shape}</token><bool name="Anchored">${anch!==false}</bool>${extra||''}</Properties>${inner||''}</Item>`}
function scriptXML(cls,name,src,inner){return`<Item class="${cls}" referent="RBX${++ref}"><Properties><string name="Name">${esc(name)}</string><ProtectedString name="Source"><![CDATA[${src.replace(/\]\]>/g,']] >')}]]></ProtectedString></Properties>${inner||''}</Item>`}

const LUA_GAME=`local Players=game:GetService("Players")
local function onPlayer(p)
	local ls=Instance.new("Folder") ls.Name="leaderstats" ls.Parent=p
	local c=Instance.new("IntValue") c.Name="Coins" c.Parent=ls
	local s=Instance.new("IntValue") s.Name="Stage" s.Parent=ls
	p.CharacterAdded:Connect(function(ch)
		local cf=p:GetAttribute("SpawnCF")
		if cf then task.wait(0.1) ch:PivotTo(cf) end
	end)
end
Players.PlayerAdded:Connect(onPlayer)
for _,p in ipairs(Players:GetPlayers()) do onPlayer(p) end

local function who(hit)
	local ch=hit.Parent
	local h=ch and ch:FindFirstChildOfClass("Humanoid")
	if h then return Players:GetPlayerFromCharacter(ch),h end
end

local function hook(d)
	if not d:IsA("BasePart") then return end
	local n=d.Name
	if n:sub(1,5)=="Kill_" then
		d.Touched:Connect(function(hit)
			local _,h=who(hit)
			if h then h.Health=0 end
		end)
	elseif n:sub(1,6)=="Check_" then
		local order=tonumber(n:match("^Check_(%d+)")) or 1
		d.Touched:Connect(function(hit)
			local p=who(hit)
			if p then
				local cur=p:GetAttribute("StageNum") or 0
				if order>cur then
					p:SetAttribute("StageNum",order)
					p:SetAttribute("SpawnCF",d.CFrame+Vector3.new(0,4,0))
					p.leaderstats.Stage.Value=order
				end
			end
		end)
	elseif n:sub(1,5)=="Coin_" then
		local taken=false
		d.Touched:Connect(function(hit)
			if taken then return end
			local p=who(hit)
			if p then
				taken=true
				p.leaderstats.Coins.Value+=1
				d.Transparency=1
				task.wait(10)
				d.Transparency=0
				taken=false
			end
		end)
	elseif n:sub(1,5)=="Jump_" then
		d.Touched:Connect(function(hit)
			local _,h=who(hit)
			if h then
				local r=hit.Parent:FindFirstChild("HumanoidRootPart")
				if r then
					local v=r.AssemblyLinearVelocity
					r.AssemblyLinearVelocity=Vector3.new(v.X,90,v.Z)
				end
			end
		end)
	end
end
for _,d in ipairs(workspace:GetDescendants()) do hook(d) end
workspace.DescendantAdded:Connect(hook)`;

function buildXML(){ref=0;let cnt=0;
const hex=c=>'#'+c.map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');
const xi=it=>{const ch=kids(it.id).map(xi).join('');const N=`<string name="Name">${esc(it.name)}</string>`,R=()=>`RBX${++ref}`;
switch(it.cls){
case 'Part':{let nm=it.name,cls='Part',ex=`<bool name="CanCollide">${!!it.can}</bool><bool name="Locked">${!!it.lock}</bool>`;
if(it.role==='Kill')nm='Kill_'+nm;else if(it.role==='Check')nm='Check_'+(++cnt)+'_'+nm;else if(it.role==='Coin')nm='Coin_'+nm;else if(it.role==='Jump')nm='Jump_'+nm;
else if(it.role==='Spawn'){cls='SpawnLocation';ex+='<bool name="Neutral">true</bool>'}
return partXML(nm,it.pos,it.size,it.ry,it.color,MATS[it.mat]||256,{Ball:0,Block:1,Cylinder:2}[it.shape],ex,cls,ch,it.anch!==false)}
case 'Model':case 'Folder':case 'ScreenGui':return`<Item class="${it.cls}" referent="${R()}"><Properties>${N}</Properties>${ch}</Item>`;
case 'Script':case 'LocalScript':case 'ModuleScript':return scriptXML(it.cls,it.name,it.src||'',ch);
case 'Sound':return`<Item class="Sound" referent="${R()}"><Properties>${N}<Content name="SoundId"><url>rbxassetid://${it.soundId|0}</url></Content><bool name="Looped">${!!it.loop}</bool><bool name="Playing">true</bool><float name="Volume">${it.vol}</float></Properties>${ch}</Item>`;
case 'PointLight':return`<Item class="PointLight" referent="${R()}"><Properties>${N}<float name="Brightness">${it.bright}</float><float name="Range">${it.range}</float>${c3('Color',it.lcolor)}</Properties></Item>`;
case 'TextLabel':return`<Item class="TextLabel" referent="${R()}"><Properties>${N}<string name="Text">${esc(it.text)}</string><int name="TextSize">${it.textSize|0}</int><UDim2 name="Position"><XS>0</XS><XO>${it.gx|0}</XO><YS>0</YS><YO>${it.gy|0}</YO></UDim2><UDim2 name="Size"><XS>0</XS><XO>${it.gw|0}</XO><YS>0</YS><YO>${it.gh|0}</YO></UDim2>${c3('BackgroundColor3',it.bg)}${c3('TextColor3',it.fg)}</Properties></Item>`;
default:return''}};
let ws=kids('Workspace').map(xi).join('');
if(terrain){const G=40,cs=terrain.size/G;
for(let i=0;i<G;i++)for(let j=0;j<G;j++){const x=-terrain.size/2+cs*(i+.5),z=-terrain.size/2+cs*(j+.5),s=sampler(x,z),h=Math.max(1,s.y);
ws+=partXML('Terrain_'+i+'_'+j,[+x.toFixed(2),+(h/2).toFixed(2),+z.toFixed(2)],[+cs.toFixed(2),+h.toFixed(2),+cs.toFixed(2)],0,hex(s.c),s.water?1568:1280,1,'','Part','',true)}}
const parts=items.filter(i=>i.cls==='Part'&&isWS(i));
if(!parts.some(o=>o.role==='Spawn'))ws+=partXML('SpawnLocation',[0,+(groundY(0,0)+3).toFixed(2),0],[6,1,6],0,'#a3a2a5',256,1,'<bool name="Neutral">true</bool>','SpawnLocation','',true);
let gen='';
if(parts.some(o=>['Kill','Check','Coin','Jump'].includes(o.role)))gen+=scriptXML('Script','GameSystem',LUA_GAME);
const as=items.filter(i=>i.cls==='Asset'&&i.assetId&&isWS(i));
if(as.length){const it=as.map(o=>`{id=${parseInt(o.assetId)},x=${o.pos[0]},y=${o.pos[1]},z=${o.pos[2]},ry=${o.ry}}`).join(',');
gen+=scriptXML('Script','ToolboxLoader',`local InsertService=game:GetService("InsertService")
local items={${it}}
for _,it in ipairs(items) do
	task.spawn(function()
		local ok,res=pcall(function() return InsertService:LoadAsset(it.id) end)
		if ok and res then
			res.Parent=workspace
			res:PivotTo(CFrame.new(it.x,it.y,it.z)*CFrame.Angles(0,math.rad(it.ry),0))
		else
			warn("Gagal load asset "..it.id)
		end
	end)
end`)}
const sv=(cls,inner,props)=>`<Item class="${cls}" referent="RBX${++ref}"><Properties><string name="Name">${cls}</string>${props||''}</Properties>${inner}</Item>`;
const S=s=>kids(s).map(xi).join('');
return`<roblox version="4">${sv('Workspace',ws)}${sv('Lighting','',`<double name="ClockTime">${clock}</double>`)}${sv('ReplicatedStorage',S('ReplicatedStorage'))}${sv('ServerScriptService',gen+S('ServerScriptService'))}${sv('ServerStorage',S('ServerStorage'))}${sv('StarterGui',S('StarterGui'))}${sv('StarterPack',S('StarterPack'))}${sv('StarterPlayer',sv('StarterPlayerScripts',S('StarterPlayerScripts')))}</roblox>`}
const plog=t=>{$('plog').textContent=t;out(t)};
$('bpub').onclick=()=>$('modal').classList.add('on');
$('bclose').onclick=()=>$('modal').classList.remove('on');
$('bexp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buildXML()],{type:'application/xml'}));a.download='map.rbxlx';a.click();plog('File map.rbxlx dibuat.')};
$('bsend').onclick=async()=>{
const key=$('ak').value.trim(),uni=$('un').value.trim(),pl=$('pl').value.trim(),px=$('pxy').value.trim().replace(/\/$/,'')||'https://apis.roblox.com';
if(!key||!uni||!pl){plog('Isi API key, Universe ID, dan Place ID.');return}
plog('Membuat file & mengirim...');
try{const r=await fetch(`${px}/universes/v1/${uni}/places/${pl}/versions?versionType=${$('vt').value}`,{method:'POST',headers:{'x-api-key':key,'Content-Type':'application/xml'},body:buildXML()});
const t=await r.text();plog(r.ok?'Berhasil! '+t:'Gagal ('+r.status+') '+t)}
catch(e){plog('Gagal terhubung. Roblox memblokir akses langsung dari browser (CORS), isi URL Worker proxy. '+e.message)}};
